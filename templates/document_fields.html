<label>Document name<input name="name" value="{{ record.get('name','') }}" maxlength="200"></label><label>Category<select name="category">{% for c in doc_categories %}<option {{ 'selected' if record.get('category')==c }}>{{ c }}</option>{% endfor %}</select></label><label>Review status<select name="status">{% for s in ['Needs Review','Possible','Approved','Excluded'] %}<option {{ 'selected' if record.get('status')==s }}>{{ s }}</option>{% endfor %}</select></label><label>Associated transaction<select name="transaction_id"><option value="">None</option>{% for t in inputs.transactions %}<option value="{{ t.id }}" {{ 'selected' if record.get('transaction_id')==t.id }}>#{{ t.id }} · {{ t.vendor }} · {{ t.amount|usd }}</option>{% endfor %}</select></label><label>Associated investment<select name="investment_id"><option value="">None</option>{% for t in inputs.trades %}<option value="{{ t.id }}" {{ 'selected' if record.get('investment_id')==t.id }}>#{{ t.id }} · {{ t.symbol }}</option>{% endfor %}</select></label><label>Associated tax payment<select name="payment_id"><option value="">None</option>{% for t in inputs.payments %}<option value="{{ t.id }}" {{ 'selected' if record.get('payment_id')==t.id }}>#{{ t.id }} · {{ t.jurisdiction }} · {{ t.amount|usd }}</option>{% endfor %}</select></label><label class="full">Notes<textarea name="notes" maxlength="2000">{{ record.get('notes','') }}</textarea></label>
